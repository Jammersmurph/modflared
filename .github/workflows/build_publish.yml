name: build_publish
on:
  workflow_dispatch:
  pull_request:
  push:
jobs:
  build_publish:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS & minimum supported by Minecraft
        ]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
          cache: gradle
      - name: make gradle wrapper executable
        if: "${{ runner.os != 'Windows' }}"
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: modflared-jar
          path: build/libs/*.jar
      - name: create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: false
      - name: upload to modrinth
        if: "contains(github.ref, '26.1') && !contains(github.event.head_commit.message, 'upload skip')"
        run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
      - name: upload to curseforge
        if: "contains(github.ref, '26.1') && !contains(github.event.head_commit.message, 'upload skip')"
        run: ./gradlew publishCurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
